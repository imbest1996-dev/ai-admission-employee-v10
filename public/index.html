<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Admission Employee V10</title><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:28px}.hero,.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}input,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border:1px solid #ccd2dc;border-radius:10px}button{cursor:pointer;font-weight:700;background:#172033;color:white}.muted{color:#667085}.chat{min-height:90px;background:#f8fafc;padding:12px;border-radius:10px;white-space:pre-wrap}.hide{display:none}.stats{display:flex;gap:12px;flex-wrap:wrap}.pill{background:#eef2ff;padding:10px 14px;border-radius:999px}</style></head><body><div class="wrap"><section class="hero"><h1>AI Admission Employee</h1><p>24×7 enquiry qualification, counselling intent and lead dashboard — V10 live-pilot candidate.</p><button onclick="track('cta_demo');document.getElementById('demo').scrollIntoView()">Try public demo</button></section><div class="grid"><section class="card" id="demo"><h2>Public demo</h2><input id="dm" value="NEET dropper ki fees kya hai?"><button onclick="demo()">Ask AI demo</button><div id="do" class="chat"></div></section><section class="card"><h2>Start 14-day trial</h2><input id="sn" placeholder="Institute name"><input id="se" placeholder="Email"><input id="sp" type="password" placeholder="Password (8+ chars)"><textarea id="sc" placeholder="Courses and fees"></textarea><button onclick="signup()">Create trial</button><div id="so" class="muted"></div></section></div><div class="grid"><section class="card"><h2>Owner login</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="lo" class="muted"></div></section><section class="card hide" id="dash"><h2>Private dashboard</h2><div id="me"></div><div class="stats" id="stats"></div><input id="cm" value="JEE demo class book karni hai"><button onclick="chat()">Simulate student enquiry</button><div id="co" class="chat"></div><button onclick="refreshOps()">Pilot system status</button><div id="ops" class="muted"></div><button onclick="exportData()">Export institute data (JSON)</button><button onclick="checkout()">Start Starter checkout (sandbox)</button><button onclick="logout()">Logout</button></section></div></div><script>
const j=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d};
function track(t){j('/api/public/event',{method:'POST',body:JSON.stringify({event_type:t})}).catch(()=>{})} track('page_view');
async function demo(){try{let d=await j('/api/public/demo',{method:'POST',body:JSON.stringify({message:dm.value})});do.textContent=d.reply+'\n\n'+JSON.stringify(d.lead,null,2)}catch(e){do.textContent=e.message}}
async function signup(){try{let d=await j('/api/auth/signup',{method:'POST',body:JSON.stringify({name:sn.value,email:se.value,password:sp.value,courses:sc.value})});so.textContent='Trial created until '+d.trial_ends_at+'. Now login.';le.value=se.value}catch(e){so.textContent=e.message}}
async function login(){try{await j('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});lo.textContent='Logged in';await load()}catch(e){lo.textContent=e.message}}
async function load(){try{let m=await j('/api/me'),s=await j('/api/stats');dash.classList.remove('hide');me.textContent=`${m.name} • ${m.subscription_status} • entitled: ${m.entitled}`;stats.innerHTML=`<span class=pill>Enquiries ${s.enquiries}</span><span class=pill>Hot ${s.hot}</span><span class=pill>Demo ${s.demo}</span>`}catch(e){dash.classList.add('hide')}}
const chatSessionId=localStorage.getItem('aae_chat_session')||(()=>{const x=(crypto.randomUUID?crypto.randomUUID():'sess_'+Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem('aae_chat_session',x);return x})();
async function chat(){try{let d=await j('/api/chat',{method:'POST',body:JSON.stringify({message:cm.value,session_id:chatSessionId})});co.textContent=d.reply+'\n'+JSON.stringify(d.lead,null,2);await load()}catch(e){co.textContent=e.message}}
async function refreshOps(){try{let d=await j('/api/ops/status');ops.textContent=`${d.version} • DB ready • uptime ${d.uptime_seconds}s • leads ${d.counts.leads} • ${d.offline_ai?'offline AI':'OpenAI enabled'}`+(d.warnings.length?' • '+d.warnings.join(' | '):'')}catch(e){ops.textContent=e.message}}
function exportData(){window.location='/api/export'}
async function checkout(){try{let d=await j('/api/billing/demo-checkout',{method:'POST',body:JSON.stringify({plan:'starter'})});alert(d.message)}catch(e){alert(e.message)}}
async function logout(){await j('/api/auth/logout',{method:'POST',body:'{}'});dash.classList.add('hide')} load();
</script></body></html>
